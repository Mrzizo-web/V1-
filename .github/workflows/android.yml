name: Android Build and Unit Tests

on:
  push:
    branches: ["main", "gateway-hardening"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gateway architecture guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -i --include='*.kt' --exclude='GatewayConfigEntity.kt' -n 'hawalaty\|hawaly\|حوالتي' app/src; then
            echo 'ERROR: legacy Hawalaty/Hawaly wallet reference found.'
            exit 1
          fi
          if grep -R --include='*.kt' -n 'findRecentSimilar\|timeWindowMillis\|same wallet, amount, and sender' app/src; then
            echo 'ERROR: heuristic financial duplicate matching is forbidden.'
            exit 1
          fi
          if grep -R --include='*.kt' -n 'adminPin: String = "1234"\|الرمز الافتراضي: 1234' app/src; then
            echo 'ERROR: insecure default admin PIN found.'
            exit 1
          fi
          if grep -R --include='*.kt' -n 'JEEB\|FLOOSAK\|JAWALI' app/src >/dev/null; then
            echo 'Supported wallets detected: JEEB, FLOOSAK, JAWALI'
          fi
          if grep -R --include='*.kt' -n 'google-services\|FirebaseAppCheck' app/src build.gradle* settings.gradle* 2>/dev/null; then
            echo 'ERROR: Firebase/AppCheck must not be introduced into the independent local SMS Gateway.'
            exit 1
          fi

      - name: Unit tests and compile all APKs
        run: gradle testDebugUnitTest assembleDebugAndroidTest assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-feul-gateway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.HttpPosGatewayCrossAppEndToEndAndroidTest

  cross-app-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout Gateway
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Checkout POS debug integration fixture
        run: git clone --depth 1 --branch main https://github.com/Mrzizo-web/POWERFEULV1.0.5.git pos-repo
      - name: Build POS debug APK
        run: gradle -p pos-repo assembleDebug
      - name: Build Gateway debug and instrumentation APKs with the same debug key
        run: gradle assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run cross-app HTTP end-to-end test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r pos-repo/app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.aistudio.powerfuelgateway.yqnw android.permission.RECEIVE_SMS
            adb shell pm grant com.aistudio.powerfuelgateway.yqnw android.permission.READ_SMS
            adb shell pm grant com.aistudio.powerfuelgateway.yqnw android.permission.POST_NOTIFICATIONS
            TEST_TOKEN="ci-integration-token-powerfeul-gateway-2026"
            DEVICE_ID="CI_EMULATOR_GATEWAY_01"
            SMS_BODY='استلمت حوالة من علي بمبلغ 800.00 ر.ي رصيدك 1500.00 ر.ي'
            adb logcat -c
            adb shell am start -n com.aistudio.powerfuelgateway.yqnw/com.example.DebugGatewayIntegrationActivity \
              --es debug_gateway_integration_token "$TEST_TOKEN" \
              --es debug_gateway_integration_device_id "$DEVICE_ID" \
              --es debug_gateway_integration_pos_ip 127.0.0.1 \
              --ei debug_gateway_integration_pos_port 18080
            READY=0
            for attempt in $(seq 1 60); do
              if adb logcat -d -s GatewayIntegrationFixture:I | grep -q 'GATEWAY_CONFIG_READY'; then
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" != "1" ]; then
              echo "Gateway integration setup did not report readiness"
              adb logcat -d -s GatewayIntegrationFixture:V
              exit 1
            fi
            adb emu sms send 0777000111 "$SMS_BODY"
            sleep 2
            gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.HttpPosGatewayCrossAppEndToEndAndroidTest
