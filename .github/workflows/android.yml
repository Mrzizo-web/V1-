name: Android Build and Unit Tests

on:
  push:
    branches: ["main", "gateway-hardening"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gateway architecture guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -i --include='*.kt' --exclude='GatewayConfigEntity.kt' -n 'hawalaty\|hawaly\|حوالتي' app/src; then
            echo 'ERROR: legacy Hawalaty/Hawaly wallet reference found.'
            exit 1
          fi
          if grep -R --include='*.kt' -n 'findRecentSimilar\|timeWindowMillis\|same wallet, amount, and sender' app/src; then
            echo 'ERROR: heuristic financial duplicate matching is forbidden.'
            exit 1
          fi
          if grep -R --include='*.kt' -n 'adminPin: String = "1234"\|الرمز الافتراضي: 1234' app/src; then
            echo 'ERROR: insecure default admin PIN found.'
            exit 1
          fi
          if grep -R --include='*.kt' -n 'JEEB\|FLOOSAK\|JAWALI' app/src >/dev/null; then
            echo 'Supported wallets detected: JEEB, FLOOSAK, JAWALI'
          fi
          if grep -R --include='*.kt' -n 'google-services\|FirebaseAppCheck' app/src build.gradle* settings.gradle* 2>/dev/null; then
            echo 'ERROR: Firebase/AppCheck must not be introduced into the independent local SMS Gateway.'
            exit 1
          fi

      - name: Unit tests and compile all APKs
        run: gradle testDebugUnitTest assembleDebugAndroidTest assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-feul-gateway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle connectedDebugAndroidTest
